name: Release integrity
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  installed-wheel:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install build pytest h5py psutil
      - run: python -m pip install "torch>=2.5,<3" --index-url https://download.pytorch.org/whl/cpu
      - run: python -m build --outdir dist-ci
      - run: python tools/check_clean_install.py --wheel dist-ci/opal_research-0.1.3.dev0-py3-none-any.whl --output clean-validation --torch-index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install dist-ci/opal_research-0.1.3.dev0-py3-none-any.whl
      - run: python -m pip install "pandas>=2.2,<4" "threadpoolctl>=3.5,<4"
      - run: python -m pytest tests/test_context_contrast.py tests/test_crossed_single_models.py tests/test_evidence_audit.py tests/test_gxe_measurement.py tests/test_gxe_reconstruction.py tests/test_gxe_streaming.py tests/test_confirmation_planning.py -q
      - run: python -m pytest tests/test_release_packaging.py tests/test_replicated.py tests/test_replicated_assay.py tests/test_replicated_sensitivity.py tests/test_replicated_power.py tests/test_replicated_protocol.py tests/test_replicated_planning.py tests/test_public_processing_diagnostic.py tests/test_retrospective.py tests/test_bulk_diagnostic.py tests/test_public_numbers.py tests/test_preparation_integrity.py tests/test_contracts.py tests/test_source_discovery.py tests/test_donor_diagnostic.py tests/test_unmatched_diagnostic.py tests/test_remote_metadata.py tests/test_source_search_coverage.py -q
      - run: python tools/rehearse_replicated_assay.py --output assay-validation
      - run: python -m pytest tests/test_model_series.py tests/test_model_series_bilinear.py tests/test_pertspectra_series.py -q
      - run: python -m pytest tests/test_information.py -q
      - run: python tools/check_installed_series.py --synthetic --output series-validation
      - run: python tools/check_installed_series.py --synthetic --config configs/experiments/opal_model_series_v2.json --output series-bilinear-validation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-${{ matrix.os }}-${{ matrix.python }}
          path: |
            clean-validation
            assay-validation/verification.json
            assay-validation/evaluation/*.json
            series-validation/verification.json
            series-bilinear-validation/verification.json
