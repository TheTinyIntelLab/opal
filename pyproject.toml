[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "opal-research"
version = "0.1.0"
description = "Auditable observed-single combinatorial response prediction"
authors = [{name = "Arjun Vijay Prakash"}]
license = {file = "LICENSE"}
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = ["numpy>=2.1,<3", "scipy>=1.14,<2", "torch>=2.5,<3", "scikit-learn>=1.5,<2", "matplotlib>=3.9,<4", "PyYAML>=6,<7"]

[project.optional-dependencies]
data = ["anndata>=0.11,<0.13", "pyarrow>=18,<26", "pandas>=2.2,<4", "h5py>=3.12,<4", "threadpoolctl>=3.5,<4"]
tabular = ["tabicl==2.2.0", "psutil>=7,<8"]
dev = ["pytest>=8,<10"]

[project.scripts]
opal = "opal.cli:main"

[project.urls]
Repository = "https://github.com/TheTinyIntelLab/opal"
Releases = "https://github.com/TheTinyIntelLab/opal/releases"
Issues = "https://github.com/TheTinyIntelLab/opal/issues"

[tool.setuptools.packages.find]
where = ["src"]
